name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Train model
        run: python train.py
      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iris-api:${{ github.sha }} .
      - name: Smoke test image
        run: |
          docker run -d --name iris -p 8000:8000 iris-api:${{ github.sha }}
          for i in $(seq 1 15); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
