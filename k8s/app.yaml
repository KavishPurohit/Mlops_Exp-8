apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
  namespace: mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
        - name: iris-api
          image: iris-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iris-api
  namespace: mlops
spec:
  selector:
    app: iris-api
  ports:
    - port: 8000
      targetPort: 8000
---
# Headless service so Prometheus can scrape each pod individually.
apiVersion: v1
kind: Service
metadata:
  name: iris-api-pods
  namespace: mlops
spec:
  clusterIP: None
  selector:
    app: iris-api
  ports:
    - port: 8000
      targetPort: 8000
