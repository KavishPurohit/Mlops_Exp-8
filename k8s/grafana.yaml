apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: mlops
data:
  iris.json: |
    {
      "uid": "iris-api",
      "title": "Iris API Monitoring",
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "title": "Total predictions", "type": "stat",
         "gridPos": {"x": 0, "y": 0, "w": 6, "h": 8},
         "targets": [{"expr": "sum(iris_requests_total)", "refId": "A"}]},
        {"id": 2, "title": "Pods up", "type": "stat",
         "gridPos": {"x": 6, "y": 0, "w": 6, "h": 8},
         "targets": [{"expr": "sum(up{job=\"iris-api\"})", "refId": "A"}]},
        {"id": 3, "title": "Requests per second", "type": "timeseries",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "sum(rate(iris_requests_total[1m]))", "legendFormat": "req/s", "refId": "A"}]},
        {"id": 4, "title": "Predictions by species", "type": "timeseries",
         "gridPos": {"x": 0, "y": 8, "w": 12, "h": 9},
         "targets": [{"expr": "sum by (species) (iris_predictions_total)", "legendFormat": "{{species}}", "refId": "A"}]},
        {"id": 5, "title": "Prediction latency p95 (s)", "type": "timeseries",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 9},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(iris_prediction_latency_seconds_bucket[1m])))", "legendFormat": "p95", "refId": "A"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mlops
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
